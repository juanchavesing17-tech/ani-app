<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<title>ANI</title>
<style>
/* Los mismos colores del panel del computador, para que sea la misma ANI. */
:root{
  --fondo:#030a12; --carta:#0a1622; --borde:#16293d;
  --texto:#dce8f4; --tenue:#7b93ab; --ani:#7fd4ff; --rojo:#ff6b6b;
  --alto: 100dvh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}

/* El fondo de constelaciones, detrás de todo y sin estorbar al dedo.

   El `width/height:100%` NO sobra aunque haya `inset:0`: un <canvas> es un
   elemento reemplazado, así que con el tamaño en `auto` se queda en sus
   300×150 de fábrica en vez de estirarse entre los bordes. Sin esto el fondo
   sale en un recuadro pequeño arriba a la izquierda. */
#particulas{
  position:fixed; inset:0; width:100%; height:100%;
  z-index:0; pointer-events:none;
}
header,#chat,footer,#aviso,#tarjeta{position:relative;z-index:1}
body{
  background:var(--fondo); color:var(--texto);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; height:var(--alto);
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
}

header{
  display:flex; align-items:center; gap:12px;
  padding:14px 18px 10px; border-bottom:1px solid var(--borde);
}
#nucleo{width:34px;height:34px;flex:none}
.titulo{font-weight:600;letter-spacing:.5px}
#estado{font-size:12.5px;color:var(--tenue);margin-top:-2px}
header .der{margin-left:auto}

button{
  font:inherit; color:var(--texto); background:var(--carta);
  border:1px solid var(--borde); border-radius:12px;
  padding:11px 16px; cursor:pointer;
}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
.icono{padding:9px 12px;font-size:18px;line-height:1}

/* ------------------------------------------------------ la conversación */
#chat{
  flex:1; overflow-y:auto; padding:16px; display:flex;
  flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch;
}
.dicho{
  max-width:82%; padding:10px 14px; border-radius:16px;
  /* Un dictado largo sin espacios no puede empujar el ancho del chat: es
     el mismo destrozo que las equis en el panel del computador. */
  overflow-wrap:anywhere; min-width:0;
}
.de-juan{align-self:flex-end;background:#123249;border-bottom-right-radius:5px}
.de-ani{align-self:flex-start;background:var(--carta);border-bottom-left-radius:5px}
.de-ani b{color:var(--ani);font-weight:600}
.vivo{opacity:.6;font-style:italic}
#vacio{margin:auto;text-align:center;color:var(--tenue);padding:0 32px}
#vacio .grande{font-size:44px;margin-bottom:10px}

/* ------------------------------------------------------------ los mandos */
footer{
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--borde); display:flex; gap:10px; align-items:center;
}
#conversar{
  flex:1; font-weight:600; padding:16px;
  background:linear-gradient(180deg,#12496b,#0d3350);
  border-color:#1d5f8a;
}
#conversar.viva{background:linear-gradient(180deg,#7fd4ff,#3ba9dd);
                color:#04202f;border-color:#9fe0ff}
#aviso{
  color:var(--rojo); font-size:13px; padding:0 18px 8px; min-height:0;
}
#aviso:empty{display:none}

/* ----------------------------------- la tarjeta de confirmar
   Lo que sale hacia fuera —un correo, una cita— pasa por aquí. Juan lo lee
   y toca. Se eligió el botón y no la voz a propósito: en obra hay ruido y
   gente hablando, y un «sí» suelto no puede mandarle un correo a nadie. */
#tarjeta{
  margin:12px 16px; padding:14px 16px; border-radius:16px;
  background:var(--carta); border:1px solid #2c4f74; display:none;
}
#tarjeta.abierta{display:block}
#tarjeta h3{margin:0 0 4px;font-size:14px;color:var(--ani);font-weight:600}
#tarjeta .cuerpo{
  font-size:14px; white-space:pre-wrap; overflow-wrap:anywhere;
  max-height:34vh; overflow-y:auto; margin:8px 0 12px;
}
#tarjeta .campo{color:var(--tenue);font-size:12.5px}
#tarjeta .botones{display:flex;gap:10px}
#tarjeta .botones button{flex:1}
#enviar{background:linear-gradient(180deg,#1c7a4a,#125536);border-color:#2a9c61;
        font-weight:600}
#cancelar{color:var(--tenue)}

/* ------------------------------------------------- la pantalla de ajustes */
#ajustes{
  position:fixed; inset:0; background:var(--fondo); z-index:9;
  padding:26px 22px; overflow-y:auto; display:none;
}
#ajustes.abierta{display:block}
#ajustes h2{margin:0 0 6px;font-size:20px}
#ajustes p{color:var(--tenue);font-size:14px;margin:0 0 22px}
label{display:block;font-size:13px;color:var(--tenue);margin:16px 0 6px}
input{
  width:100%; padding:13px; border-radius:12px; font:inherit;
  background:var(--carta); border:1px solid var(--borde); color:var(--texto);
}
.firma{
  margin-top:34px; padding-top:16px; border-top:1px solid var(--borde);
  color:var(--tenue); font-size:12px; text-align:center;
}
</style>
</head>
<body>

<canvas id="particulas" aria-hidden="true"></canvas>

<header>
  <svg id="nucleo" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="30" fill="none" stroke="var(--ani)"
            stroke-width="4" opacity=".85"/>
    <circle id="pulso" cx="50" cy="50" r="15" fill="var(--ani)" opacity=".5"/>
  </svg>
  <div>
    <div class="titulo">ANI</div>
    <div id="estado">En reposo</div>
  </div>
  <button class="icono der" id="btnInforme" title="El informe de hoy">☀</button>
  <button class="icono" id="btnAjustes" title="Ajustes">⚙</button>
</header>

<div id="chat">
  <div id="vacio">
    <div class="grande">🎙</div>
    Pulse <b>Conversar</b> y hábleme, jefe.
  </div>
</div>

<div id="aviso"></div>

<section id="tarjeta">
  <h3 id="tarjetaTitulo">Esperando su visto bueno</h3>
  <div class="campo" id="tarjetaCampo"></div>
  <div class="cuerpo" id="tarjetaCuerpo"></div>
  <div class="botones">
    <button id="enviar">Enviar</button>
    <button id="cancelar">Cancelar</button>
  </div>
</section>

<footer>
  <button id="conversar">Conversar</button>
  <button class="icono" id="btnFoto" title="Enseñarle una foto">📷</button>
  <button class="icono" id="btnSilencio" title="Silenciar el micrófono"
          disabled>🔊</button>
</footer>

<input type="file" id="camara" accept="image/*" capture="environment" hidden>

<section id="ajustes">
  <h2>Conectar con ANI</h2>
  <p>Estos dos datos salen del proyecto «ANI de campo» de Apps Script.
     Se guardan solo en este teléfono.</p>

  <label for="url">Dirección de la aplicación web</label>
  <input id="url" type="url" inputmode="url" autocomplete="off"
         placeholder="https://script.google.com/macros/s/.../exec">

  <label for="secreto">La llave</label>
  <input id="secreto" type="password" autocomplete="off"
         placeholder="40 caracteres">

  <label style="margin-top:26px"></label>
  <button id="guardar" style="width:100%;font-weight:600">Guardar y probar</button>
  <button id="olvidar" style="width:100%;margin-top:10px;color:var(--rojo)">
    Olvidar este acceso</button>

  <div class="firma">ANI por Juan Guillermo Chaves · INGEOMAS</div>
</section>

<script type="module" src="principal.js"></script>
</body>
</html>
